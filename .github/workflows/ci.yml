name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SmartReconcile.sln
      - run: dotnet build SmartReconcile.sln --configuration Release --no-restore
      - run: dotnet test SmartReconcile.sln --configuration Release --no-build
